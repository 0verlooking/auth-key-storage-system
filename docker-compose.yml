# ============================================================================
# Docker Compose Configuration for Auth Key Storage System
# ============================================================================
# Версія: 3.8
# Сервіси:
#   - postgres: PostgreSQL 15 база даних
#   - redis: Redis 7 для кешування та сесій
#   - backend: Spring Boot REST API
#   - frontend: React SPA з Nginx
#   - pgadmin: PostgreSQL Admin (опціонально, для розробки)
# ============================================================================

version: '3.8'

# ============================================================================
# NETWORKS
# ============================================================================
networks:
  app-network:
    driver: bridge
    name: auth-key-storage-network

# ============================================================================
# VOLUMES
# ============================================================================
volumes:
  postgres-data:
    name: auth-key-storage-postgres-data
  redis-data:
    name: auth-key-storage-redis-data
  pgadmin-data:
    name: auth-key-storage-pgadmin-data

# ============================================================================
# SERVICES
# ============================================================================
services:
  # ==========================================================================
  # PostgreSQL Database
  # ==========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: auth-storage-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auth_storage_db}
      POSTGRES_USER: ${POSTGRES_USER:-auth_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auth_password_change_me}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
      PGDATA: /var/lib/postgresql/data/pgdata

    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Опціонально: початкові SQL скрипти
      # - ./database/init:/docker-entrypoint-initdb.d

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    networks:
      - app-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-auth_user} -d ${POSTGRES_DB:-auth_storage_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    # Оптимізація для розробки (зменшіть для production)
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1GB"

  # ==========================================================================
  # Redis Cache
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: auth-storage-redis
    restart: unless-stopped

    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password_change_me} --maxmemory 256mb --maxmemory-policy allkeys-lru

    volumes:
      - redis-data:/data

    ports:
      - "${REDIS_PORT:-6379}:6379"

    networks:
      - app-network

    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================================================
  # Backend - Spring Boot Application
  # ==========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: auth-storage-backend
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      # Spring Profile
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}

      # Database Configuration
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-auth_storage_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-auth_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-auth_password_change_me}

      # JPA/Hibernate Configuration
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${JPA_DDL_AUTO:-create}
      SPRING_JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: true

      # Redis Configuration
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password_change_me}

      # JWT Configuration
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production-at-least-256-bits}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}

      # Server Configuration
      SERVER_PORT: 8080

      # CORS Configuration
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:80,http://frontend}

      # Logging
      LOGGING_LEVEL_ROOT: ${LOG_LEVEL_ROOT:-INFO}
      LOGGING_LEVEL_COM_AUTHKEY: ${LOG_LEVEL_APP:-DEBUG}

      # Mail Configuration (опціонально)
      SPRING_MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: true
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: true

      # Actuator
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: when_authorized

      # Java Options
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m}

    ports:
      - "${BACKEND_PORT:-8080}:8080"

    networks:
      - app-network

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    # Обмеження ресурсів (налаштуйте під свої потреби)
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ==========================================================================
  # Frontend - React + Nginx
  # ==========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_APP_TITLE: ${VITE_APP_TITLE:-Auth Key Storage System}
        VITE_APP_VERSION: ${VITE_APP_VERSION:-1.0.0}

    container_name: auth-storage-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "${FRONTEND_PORT:-80}:80"

    networks:
      - app-network

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Обмеження ресурсів
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ==========================================================================
  # PgAdmin - PostgreSQL Administration (Optional, for Development)
  # ==========================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: auth-storage-pgadmin
    restart: unless-stopped

    profiles:
      - dev
      - development

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@authstorage.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'

    volumes:
      - pgadmin-data:/var/lib/pgadmin

    ports:
      - "${PGADMIN_PORT:-5050}:80"

    networks:
      - app-network

    depends_on:
      - postgres

# ============================================================================
# USAGE:
# ============================================================================
# Запуск всіх сервісів:
#   docker-compose up -d
#
# Запуск з pgadmin (development):
#   docker-compose --profile dev up -d
#
# Зупинка:
#   docker-compose down
#
# Зупинка з видаленням volumes:
#   docker-compose down -v
#
# Перегляд логів:
#   docker-compose logs -f
#   docker-compose logs -f backend
#
# Перезапуск окремого сервісу:
#   docker-compose restart backend
#
# Перебудова образів:
#   docker-compose build --no-cache
#   docker-compose up -d --build
# ============================================================================
