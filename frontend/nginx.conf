# ============================================================================
# Nginx Configuration for Auth Key Storage System Frontend
# ============================================================================
# Оптимізована конфігурація для React SPA (Single Page Application)
# - Підтримка React Router (history mode)
# - Проксі для API запитів до backend
# - Gzip compression
# - Оптимізація кешування
# - Безпека headers
# ============================================================================

# Основна конфігурація Nginx
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Оптимізація подій
events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # ========================================================================
    # Базові налаштування
    # ========================================================================
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Формат логів
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # ========================================================================
    # Оптимізація продуктивності
    # ========================================================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # ========================================================================
    # Gzip Compression
    # ========================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject
        image/svg+xml;
    gzip_disable "msie6";

    # ========================================================================
    # Upstream для Backend API
    # ========================================================================
    upstream backend_api {
        # Назва сервісу з docker-compose
        server backend:8080;

        # Налаштування для підвищення надійності
        keepalive 32;
    }

    # ========================================================================
    # Server Block
    # ========================================================================
    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # ====================================================================
        # Security Headers
        # ====================================================================
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Content Security Policy (налаштуйте під ваші потреби)
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

        # ====================================================================
        # Health Check Endpoint
        # ====================================================================
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ====================================================================
        # API Proxy до Backend
        # ====================================================================
        location /api/ {
            # Проксі до backend сервісу
            proxy_pass http://backend_api/api/;

            # Proxy Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;

            # WebSocket support (якщо потрібно)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Не кешувати API відповіді
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            expires off;
        }

        # ====================================================================
        # Static Files - Агресивне кешування
        # ====================================================================
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;

            # Fallback якщо файл не знайдено
            try_files $uri =404;
        }

        # ====================================================================
        # React Router - SPA Support
        # ====================================================================
        # Всі інші запити перенаправляємо на index.html
        # Це необхідно для підтримки client-side routing
        location / {
            try_files $uri $uri/ /index.html;

            # Кешування для index.html
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            expires off;
        }

        # ====================================================================
        # Error Pages
        # ====================================================================
        error_page 404 /index.html;

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }

        # ====================================================================
        # Deny Access to Hidden Files
        # ====================================================================
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
